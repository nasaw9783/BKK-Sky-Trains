name: Build iOS & Android Apps
run-name: Build iOS & Android Apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish / Update GitHub Release'
        type: boolean
        default: true
      custom_tag:
        description: 'Custom tag name (optional, e.g. v1.3.6)'
        required: false
        type: string
        default: ''
      cleanup_old_releases:
        description: 'Clean up older releases on GitHub before publishing'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build iOS IPA & Android APK (Automated Release)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Environment & Tools
        working-directory: bkk_skytrains_flutter
        run: |
          flutter --version
          pod --version

      - name: Install Dependencies
        working-directory: bkk_skytrains_flutter
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: bkk_skytrains_flutter/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('bkk_skytrains_flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Run Static Analysis
        working-directory: bkk_skytrains_flutter
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        working-directory: bkk_skytrains_flutter
        run: flutter test

      - name: Extract App Version
        id: app_version
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //' | tr -d '\r\n')
          VERSION_BASE=$(echo $VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $VERSION | cut -d'+' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION (Base: $VERSION_BASE, Build: $BUILD_NUMBER)"

      - name: Build Android APK (Release)
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          BUILD_NUMBER="${{ steps.app_version.outputs.build_number }}"
          echo "Building Android APK for release v${VERSION_BASE} (Build ${BUILD_NUMBER})..."
          flutter build apk --release
          mkdir -p ../releases/Android/APK
          APK_NAME="BKK_SkyTrains_V.${VERSION_BASE}_(Build ${BUILD_NUMBER}).apk"
          cp build/app/outputs/flutter-apk/app-release.apk "../releases/Android/APK/${APK_NAME}"
          cd ../releases/Android/APK
          shasum -a 256 "${APK_NAME}" > "${APK_NAME}.sha256"

      - name: Build Android App Bundle (AAB Release)
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          BUILD_NUMBER="${{ steps.app_version.outputs.build_number }}"
          echo "Building Android App Bundle for release v${VERSION_BASE} (Build ${BUILD_NUMBER})..."
          flutter build appbundle --release
          mkdir -p ../releases/Android/AAB
          AAB_NAME="BKK_SkyTrains_V.${VERSION_BASE}_(Build ${BUILD_NUMBER}).aab"
          cp build/app/outputs/bundle/release/app-release.aab "../releases/Android/AAB/${AAB_NAME}"
          cd ../releases/Android/AAB
          shasum -a 256 "${AAB_NAME}" > "${AAB_NAME}.sha256"

      - name: Build iOS (Release without Codesign)
        working-directory: bkk_skytrains_flutter
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA & Generate Checksums
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          BUILD_NUMBER="${{ steps.app_version.outputs.build_number }}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          mkdir -p ../releases/Apple/IPA
          IPA_NAME="BKK_SkyTrains_V.${VERSION_BASE}_(Build ${BUILD_NUMBER}).ipa"
          zip -r -9 "../releases/Apple/IPA/${IPA_NAME}" Payload
          cd ../releases/Apple/IPA
          shasum -a 256 "${IPA_NAME}" > "${IPA_NAME}.sha256"
          rm -rf ../../../bkk_skytrains_flutter/Payload

      - name: Package Release Bundle (BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages)
        run: |
          mkdir -p releases/Packages
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          BUILD_NUMBER="${{ steps.app_version.outputs.build_number }}"
          PKG_NAME="BKK_SkyTrains_V.${VERSION_BASE}_(Build ${BUILD_NUMBER})_Release_Packages.zip"
          zip -r -9 "releases/Packages/${PKG_NAME}" releases/Android releases/Apple
          cd releases/Packages
          shasum -a 256 "${PKG_NAME}" > "${PKG_NAME}.sha256"

      - name: Upload All Release Artifacts (BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages)
        uses: actions/upload-artifact@v4
        with:
          name: BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages
          path: |
            releases/Packages/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages.zip
            releases/Packages/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages.zip.sha256
          retention-days: 14

      - name: Upload Android APK Artifact (BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).apk)
        uses: actions/upload-artifact@v4
        with:
          name: BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).apk
          path: |
            releases/Android/APK/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).apk
            releases/Android/APK/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).apk.sha256
          retention-days: 14

      - name: Upload iOS IPA Artifact (BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).ipa)
        uses: actions/upload-artifact@v4
        with:
          name: BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).ipa
          path: |
            releases/Apple/IPA/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).ipa
            releases/Apple/IPA/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).ipa.sha256
          retention-days: 14

      - name: Clean up older releases on GitHub
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentTag = "${{ (github.event_name == 'workflow_dispatch' && inputs.custom_tag != null && inputs.custom_tag != '') && inputs.custom_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.app_version.outputs.version_base)) }}";
            console.log(`Current release tag: ${currentTag}. Cleaning up older releases on GitHub...`);
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50
            });
            console.log(`Found ${releases.data.length} releases.`);
            for (const r of releases.data) {
              if (r.tag_name !== currentTag && r.tag_name !== 'latest') {
                console.log(`Deleting old release ${r.name} (tag: ${r.tag_name}, id: ${r.id})...`);
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: r.id
                  });
                  console.log(`Successfully deleted release id ${r.id}`);
                } catch (err) {
                  console.warn(`Failed to delete release id ${r.id}:`, err.message);
                }
              }
            }

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && inputs.custom_tag != null && inputs.custom_tag != '') && inputs.custom_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.app_version.outputs.version_base)) }}
          name: ${{ format('BKK SkyTrains v{0} (Build {1})', steps.app_version.outputs.version_base, steps.app_version.outputs.build_number) }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ### 🚆 BKK SkyTrains Production Release v${{ steps.app_version.outputs.version_base }} (Build ${{ steps.app_version.outputs.build_number }})
            - **📦 All Packages Bundle**: `BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages.zip`
            - **🤖 Android Application**: `BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).apk`
            - **🍎 iOS Application**: `BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).ipa`
            - **Key Features & Enhancements**:
              - Header 3-Tier System Clock Card (`#hdrClockCard`) with gradient digits, instant `12H` / `24H` / Device Auto format switching, 4 date layout styles, and Buddhist/Christian Era (`BE`/`CE`) support.
              - Nearest Station Popup Top Info Stack (`#popupTopCards`): System Time card (`#popupClockCard`), Live Weather card via Open-Meteo API with 3D weather SVG icons (`#popupWeatherCard`), and Holidays card (`#popupHolidayCard`) with Thai Public Holidays + BTS Office Holidays (2569–2570, 17 days/year) symmetric 2-column grid panel.
              - Native Android Custom `RemoteViews` Lock Screen Notification Card (`DecoratedCustomViewStyle` + `notification_station_expanded.xml` / `collapsed.xml`) displaying contrast-adaptive station badges, distance, and 2 platforms with up to 3 arrival countdowns per platform via `BKKLiveBridge`, alongside Android AppWidget (`StationWidgetProvider`) and iOS WidgetKit (`StationWidget`).
              - Active expanded station node blue pulse ring (`pulseRingBlue` / `pulseRingBlueLight`), dynamic `8px` toast notification anchoring (`syncToastPosition`), and 12-step Interactive Spotlight Tour (`#spotlightOverlay`).
              - Live Traffic Disruption & Incident Dialog system (`TrafficTrainDialogView`) with Broadcast Banner, Header Status Pill, 5-line status table, Normal Service Reassurance Card, and Disruption Simulation Toggle.
              - High-resolution Transit Network Blueprint Vector Map (12 transit lines) with Light/Dark auto-switching, interactive station hotspots, and Transit Network Legend modal.
              - Depot & maintenance train telemetry filtering (`YL00`, `PK00`) and real-time transit operating hours validation (05:30/06:00 - 24:00).
              - Nearest alternate stations smooth horizontal scrolling on mobile displays and trilingual support (TH / EN / ZH).
              - Offline Service Worker Cache `bkk-v111` with Critical Shell / Large Media split pre-caching.
              - Unified element centering and train line icon standards (`getLineIconSvg`).
            - **Security & Integrity**: Cryptographic SHA-256 checksums provided for all distribution packages; Android cleartext disabled (`usesCleartextTraffic="false"`).
          files: |
            releases/Packages/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages.zip
            releases/Packages/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }})_Release_Packages.zip.sha256
            releases/Android/APK/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).apk
            releases/Android/APK/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).apk.sha256
            releases/Apple/IPA/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).ipa
            releases/Apple/IPA/BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}_(Build ${{ steps.app_version.outputs.build_number }}).ipa.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
