name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish / Update GitHub Release'
        type: boolean
        default: true
      custom_tag:
        description: 'Custom tag name (optional, e.g. v1.3.3)'
        required: false
        type: string
        default: ''
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (Automated Release)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key-secret: ${{ runner.os }}-flutter

      - name: Verify Environment & Tools
        working-directory: bkk_skytrains_flutter
        run: |
          flutter --version
          pod --version

      - name: Install Dependencies
        working-directory: bkk_skytrains_flutter
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: bkk_skytrains_flutter/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('bkk_skytrains_flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Run Static Analysis
        working-directory: bkk_skytrains_flutter
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: bkk_skytrains_flutter
        run: flutter test

      - name: Extract App Version
        id: app_version
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //' | tr -d '\r\n')
          VERSION_BASE=$(echo $VERSION | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION (Base: $VERSION_BASE)"

      - name: Build Android APK (if not present)
        working-directory: bkk_skytrains_flutter
        run: |
          if [ ! -f "../releases/BKK_SkyTrains_Android_latest.apk" ]; then
            echo "Building Android APK for unified release..."
            flutter build apk --release
            mkdir -p ../releases
            cp build/app/outputs/flutter-apk/app-release.apk ../releases/BKK_SkyTrains_Android_latest.apk
            shasum -a 256 ../releases/BKK_SkyTrains_Android_latest.apk > ../releases/BKK_SkyTrains_Android_latest.apk.sha256
          fi

      - name: Build iOS (Release without Codesign)
        working-directory: bkk_skytrains_flutter
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA & Generate Checksums
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 BKK_SkyTrains_iOS_latest.ipa Payload
          cp BKK_SkyTrains_iOS_latest.ipa BKK_SkyTrains_iOS_unsigned.ipa
          cp BKK_SkyTrains_iOS_latest.ipa "BKK_SkyTrains_iOS_v${VERSION_BASE}.ipa"
          shasum -a 256 BKK_SkyTrains_iOS_latest.ipa > BKK_SkyTrains_iOS_latest.ipa.sha256
          shasum -a 256 BKK_SkyTrains_iOS_unsigned.ipa > BKK_SkyTrains_iOS_unsigned.ipa.sha256
          shasum -a 256 "BKK_SkyTrains_iOS_v${VERSION_BASE}.ipa" > "BKK_SkyTrains_iOS_v${VERSION_BASE}.ipa.sha256"
          rm -rf Payload

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BKK_SkyTrains_iOS_latest
          path: |
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_latest.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_latest.ipa.sha256
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa.sha256
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_v*.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_v*.ipa.sha256
          retention-days: 14

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (inputs.custom_tag != null && inputs.custom_tag != '') && inputs.custom_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.app_version.outputs.version_base)) }}
          name: ${{ format('BKK SkyTrains v{0} (iOS & Android)', steps.app_version.outputs.version_base) }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_latest.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_latest.ipa.sha256
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa.sha256
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_v*.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_v*.ipa.sha256
            releases/BKK_SkyTrains_Android_latest.apk
            releases/BKK_SkyTrains_Android_latest.apk.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
