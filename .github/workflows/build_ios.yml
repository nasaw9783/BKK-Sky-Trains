name: Build iOS & Android Apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish / Update GitHub Release'
        type: boolean
        default: true
      custom_tag:
        description: 'Custom tag name (optional, e.g. v1.3.6)'
        required: false
        type: string
        default: ''
      cleanup_old_releases:
        description: 'Clean up older releases on GitHub before publishing'
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build iOS IPA & Android APK (Automated Release)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Tools
        working-directory: bkk_skytrains_flutter
        run: |
          flutter --version
          pod --version

      - name: Install Dependencies
        working-directory: bkk_skytrains_flutter
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: bkk_skytrains_flutter/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('bkk_skytrains_flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Run Static Analysis
        working-directory: bkk_skytrains_flutter
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: bkk_skytrains_flutter
        run: flutter test

      - name: Extract App Version
        id: app_version
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //' | tr -d '\r\n')
          VERSION_BASE=$(echo $VERSION | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION (Base: $VERSION_BASE)"

      - name: Build Android APK (Release)
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          echo "Building Android APK for release v${VERSION_BASE}..."
          flutter build apk --release
          mkdir -p ../releases/Android/APK
          cp build/app/outputs/flutter-apk/app-release.apk "../releases/Android/APK/BKK_SkyTrains_V.${VERSION_BASE}.apk"
          shasum -a 256 "../releases/Android/APK/BKK_SkyTrains_V.${VERSION_BASE}.apk" > "../releases/Android/APK/BKK_SkyTrains_V.${VERSION_BASE}.apk.sha256"

      - name: Build Android App Bundle (AAB Release)
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          echo "Building Android App Bundle for release v${VERSION_BASE}..."
          flutter build appbundle --release
          mkdir -p ../releases/Android/AAB
          cp build/app/outputs/bundle/release/app-release.aab "../releases/Android/AAB/BKK_SkyTrains_V.${VERSION_BASE}.aab"
          shasum -a 256 "../releases/Android/AAB/BKK_SkyTrains_V.${VERSION_BASE}.aab" > "../releases/Android/AAB/BKK_SkyTrains_V.${VERSION_BASE}.aab.sha256"

      - name: Build iOS (Release without Codesign)
        working-directory: bkk_skytrains_flutter
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA & Generate Checksums
        working-directory: bkk_skytrains_flutter
        run: |
          VERSION_BASE="${{ steps.app_version.outputs.version_base }}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          mkdir -p ../releases/Apple/IPA
          zip -r -9 "../releases/Apple/IPA/BKK_SkyTrains_V.${VERSION_BASE}.ipa" Payload
          shasum -a 256 "../releases/Apple/IPA/BKK_SkyTrains_V.${VERSION_BASE}.ipa" > "../releases/Apple/IPA/BKK_SkyTrains_V.${VERSION_BASE}.ipa.sha256"
          rm -rf Payload

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BKK_SkyTrains_Release_Packages
          path: |
            releases/Apple/IPA/BKK_SkyTrains_V.*.ipa
            releases/Apple/IPA/BKK_SkyTrains_V.*.ipa.sha256
            releases/Android/APK/BKK_SkyTrains_V.*.apk
            releases/Android/APK/BKK_SkyTrains_V.*.apk.sha256
            releases/Android/AAB/BKK_SkyTrains_V.*.aab
            releases/Android/AAB/BKK_SkyTrains_V.*.aab.sha256
          retention-days: 14

      - name: Clean up older releases (if requested)
        if: github.event_name == 'workflow_dispatch' && inputs.cleanup_old_releases == true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50
            });
            console.log(`Found ${releases.data.length} releases.`);
            for (const r of releases.data) {
              console.log(`Deleting old release ${r.name} (${r.tag_name})...`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: r.id
                });
                console.log(`Successfully deleted release id ${r.id}`);
              } catch (err) {
                console.warn(`Failed to delete release id ${r.id}:`, err.message);
              }
            }

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && inputs.custom_tag != null && inputs.custom_tag != '') && inputs.custom_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.app_version.outputs.version_base)) }}
          name: ${{ format('BKK SkyTrains v{0} (iOS & Android)', steps.app_version.outputs.version_base) }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ### 🚆 BKK SkyTrains Production Release v${{ steps.app_version.outputs.version_base }}
            - **iOS Application**: Production IPA package (`BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}.ipa`)
            - **Android Application**: Production APK & App Bundle packages (`BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}.apk`, `BKK_SkyTrains_V.${{ steps.app_version.outputs.version_base }}.aab`)
            - **Key Features & Enhancements**:
              - High-resolution Transit Network Blueprint Map with interactive vector SVG overlay across 10 Bangkok transit lines (Sukhumvit, Silom, Gold, Blue, Purple, BRT, Pink, Yellow, Dark Red, Light Red, ARL, Orange).
              - Theme-aware vector SVG map auto-switching with high-contrast typography (Light / Dark mode).
              - Interactive station hotspots for instant Origin/Destination selection and Exit Directory.
              - Transit network legend modal (Transit lines and connections - Airport, Pier/Boat, Intercity Train, Bus Terminal, Park & Ride).
              - Depot & maintenance train telemetry filtering (`YL00`, `PK00`).
              - Real-time transit operating hours validation (05:30/06:00 - 24:00).
              - Nearest alternate stations smooth horizontal scrolling on mobile displays.
              - Offline Service Worker Cache `bts-v52` with map asset pre-caching.
              - Unified element centering and train line icon standards.
            - **Security & Integrity**: Cryptographic SHA-256 checksums provided for all distribution packages.
          files: |
            releases/Apple/IPA/BKK_SkyTrains_V.*.ipa
            releases/Apple/IPA/BKK_SkyTrains_V.*.ipa.sha256
            releases/Android/APK/BKK_SkyTrains_V.*.apk
            releases/Android/APK/BKK_SkyTrains_V.*.apk.sha256
            releases/Android/AAB/BKK_SkyTrains_V.*.aab
            releases/Android/AAB/BKK_SkyTrains_V.*.aab.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
