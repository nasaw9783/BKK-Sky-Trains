name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish / Update GitHub Release'
        type: boolean
        default: true
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'Start-BKK-Transit.ps1'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Start-BKK-Transit.ps1'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key-secret: ${{ runner.os }}-flutter

      - name: Verify Environment & Tools
        working-directory: bkk_skytrains_flutter
        run: |
          flutter --version
          pod --version

      - name: Install Dependencies
        working-directory: bkk_skytrains_flutter
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: bkk_skytrains_flutter/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('bkk_skytrains_flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Run Static Analysis
        working-directory: bkk_skytrains_flutter
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: bkk_skytrains_flutter
        run: flutter test

      - name: Build iOS (Release without Codesign)
        working-directory: bkk_skytrains_flutter
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA & Generate Checksum
        working-directory: bkk_skytrains_flutter
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 BKK_SkyTrains_iOS_unsigned.ipa Payload
          shasum -a 256 BKK_SkyTrains_iOS_unsigned.ipa > BKK_SkyTrains_iOS_unsigned.ipa.sha256
          rm -rf Payload

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BKK_SkyTrains_iOS_unsigned
          path: |
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa.sha256
          retention-days: 14

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('BKK SkyTrains {0} (iOS & Android)', github.ref_name) || 'BKK SkyTrains Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa
            bkk_skytrains_flutter/BKK_SkyTrains_iOS_unsigned.ipa.sha256
            releases/BKK_SkyTrains_Android_latest.apk
            releases/BKK_SkyTrains_Android_latest.apk.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
