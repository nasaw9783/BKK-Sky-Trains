name: bkk_skytrains_flutter
description: "BKK SKYTRAINs — Real-time Bangkok SkyTrains transit tracking app"
publish_to: 'none'

version: 1.3.6+10

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/www/
    - assets/www/js/
    - assets/www/images/
    - assets/www/icons/
    - assets/www/icons/lines/
    - assets/www/icons/legend/
    - assets/www/icons/nav/
    - assets/www/icons/ui/
