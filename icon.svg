<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0c172a"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>

    <!-- Bangkok Transit Rainbow Edge Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="28%" stop-color="#0284c7"/>
      <stop offset="68%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Train Body Gradient (Metallic Pearl Platinum) -->
    <linearGradient id="trainBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Windshield Deep Glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="45%" stop-color="#0f192d"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>

    <!-- Destination Box Glass -->
    <linearGradient id="destBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- LED Headlight Laser Glow -->
    <radialGradient id="laserGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Track Environment Glow -->
    <radialGradient id="trackAmbient" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#040710" stop-opacity="0"/>
    </radialGradient>

    <!-- Projector Headlight Beam -->
    <linearGradient id="beamLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Base Squircle with Neon Transit Rim -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4.5"/>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#trackAmbient)"/>

  <!-- High-tech Background Compass & Grid Rings -->
  <circle cx="256" cy="225" r="195" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="2"/>
  <circle cx="256" cy="225" r="145" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5"/>
  <circle cx="256" cy="225" r="95" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="256" y1="20" x2="256" y2="492" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="20" y1="225" x2="492" y2="225" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- 2. Perspective Elevated Monorail Tracks -->
  <g id="tracks">
    <!-- Elevated Concrete Guide-Beam -->
    <polygon points="230,465 282,465 268,345 244,345" fill="#0f172a" fill-opacity="0.8"/>
    <!-- Left Rail Speed Line (Sukhumvit Green) -->
    <path d="M 45 478 C 128 435, 195 385, 224 338" stroke="#22c55e" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 64 478 C 140 435, 202 385, 228 338" stroke="#00807d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Right Rail Speed Line (MRT Blue) -->
    <path d="M 467 478 C 384 435, 317 385, 288 338" stroke="#0284c7" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 448 478 C 372 435, 310 385, 284 338" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Perspective Sleepers -->
    <line x1="125" y1="442" x2="387" y2="442" stroke="#334155" stroke-width="3" opacity="0.4"/>
    <line x1="168" y1="406" x2="344" y2="406" stroke="#334155" stroke-width="2.5" opacity="0.35"/>
    <line x1="200" y1="375" x2="312" y2="375" stroke="#334155" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- 3. Dynamic Forward Headlight Beams -->
  <polygon points="186,298 120,465 235,465 204,298" fill="url(#beamLeft)"/>
  <polygon points="326,298 392,465 277,465 308,298" fill="url(#beamRight)"/>

  <!-- 4. Aerodynamic Bullet Skytrain Front -->
  <g id="trainNose" transform="translate(256, 210)">
    <!-- Ambient Shadow Under Vehicle -->
    <ellipse cx="0" cy="156" rx="138" ry="25" fill="#000000" fill-opacity="0.75"/>

    <!-- Roof Speed Fin -->
    <path d="M -28 -148 L 0 -178 L 28 -148 Z" fill="#0284c7"/>
    <polygon points="-8,-156 8,-156 12,-146 -12,-146" fill="#64748b"/>

    <!-- Main Aerodynamic Body Capsule -->
    <path d="M -124 -80
             C -124 -144, -86 -154, 0 -154
             C 86 -154, 124 -144, 124 -80
             L 124 105
             C 124 142, 82 156, 0 156
             C -82 156, -124 142, -124 105
             Z"
          fill="url(#trainBodyGrad)"
          stroke="#94a3b8"
          stroke-width="1"/>

    <!-- Side Metallic Bevel Shadows -->
    <path d="M -124 -80 C -124 -144, -86 -154, 0 -154 L 0 156 C -82 156, -124 142, -124 105 Z" fill="#000000" fill-opacity="0.04"/>

    <!-- Panoramic Tinted Smart-Glass Cockpit -->
    <path d="M -96 -64
             C -96 -116, -66 -126, 0 -126
             C 66 -126, 96 -116, 96 -64
             L 96 20
             C 96 38, 66 46, 0 46
             C -66 46, -96 38, -96 20
             Z"
          fill="url(#glassGrad)"
          stroke="#0f172a"
          stroke-width="2.5"/>

    <!-- Specular Light Reflection Sweep across Windshield -->
    <path d="M -82 -48
             C -82 -96, -56 -110, 0 -110
             C 28 -110, 54 -104, 70 -92
             L -40 32
             C -66 26, -82 5, -82 -48 Z"
          fill="#ffffff"
          fill-opacity="0.14"/>
    <polygon points="52,-86 70,-74 -12,36 -30,36" fill="#38bdf8" fill-opacity="0.16"/>

    <!-- Destination Digital Sign Board (BKK SKYTRAINs) -->
    <rect x="-82" y="-110" width="164" height="24" rx="7" fill="url(#destBoxGrad)" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.8"/>
    <text x="0" y="-94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1.8">BKK SKYTRAINs</text>

    <!-- Speed Accent Side Wing Stripes (Bangkok Lines) -->
    <!-- Left Wing Stripes -->
    <path d="M -124 12 L -98 12 L -98 34 L -124 34 Z" fill="#22c55e"/>
    <path d="M -124 38 L -98 38 L -98 58 L -124 58 Z" fill="#0284c7"/>
    <path d="M -124 62 L -98 62 L -98 80 L -124 80 Z" fill="#f59e0b"/>
    <path d="M -124 84 L -98 84 L -98 100 L -124 100 Z" fill="#ec4899"/>

    <!-- Right Wing Stripes -->
    <path d="M 124 12 L 98 12 L 98 34 L 124 34 Z" fill="#22c55e"/>
    <path d="M 124 38 L 98 38 L 98 58 L 124 58 Z" fill="#0284c7"/>
    <path d="M 124 62 L 98 62 L 98 80 L 124 80 Z" fill="#f59e0b"/>
    <path d="M 124 84 L 98 84 L 98 100 L 124 100 Z" fill="#ec4899"/>

    <!-- Modern Sharp Projector Headlights (Angled Blade Clusters) -->
    <!-- Left Headlight Blade -->
    <g transform="translate(-64, 82)">
      <circle cx="0" cy="0" r="22" fill="url(#laserGlow)"/>
      <!-- Angled blade housing -->
      <polygon points="-22,-5 18,-1 12,9 -16,6" fill="#0f172a"/>
      <!-- Glowing LED strip -->
      <polygon points="-20,-3 16,1 10,7 -14,4" fill="#ffffff"/>
      <polygon points="-16,-1 12,2 8,5 -10,3" fill="#38bdf8"/>
    </g>

    <!-- Right Headlight Blade -->
    <g transform="translate(64, 82)">
      <circle cx="0" cy="0" r="22" fill="url(#laserGlow)"/>
      <!-- Angled blade housing -->
      <polygon points="-18,-1 22,-5 16,6 -12,9" fill="#0f172a"/>
      <!-- Glowing LED strip -->
      <polygon points="-16,1 20,-3 14,4 -10,7" fill="#ffffff"/>
      <polygon points="-12,2 16,-1 10,3 -8,5" fill="#38bdf8"/>
    </g>

    <!-- Center Nose Aero Emblem: Interlocking Transit Rings & Winged Arrows -->
    <circle cx="0" cy="80" r="15" fill="#090e1a" stroke="#38bdf8" stroke-width="1.6"/>
    <!-- Winged Speed Chevrons (Dual Color) -->
    <path d="M -8 77 L 0 83 L 8 77" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M -8 82 L 0 88 L 8 82" stroke="#22c55e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Lower Aero Diffuser & Track Sensor -->
    <polygon points="-56,118 56,118 44,144 -44,144" fill="#1e293b"/>
    <rect x="-28" y="128" width="56" height="12" rx="4" fill="#0b1120"/>
    <circle cx="-16" cy="134" r="2.5" fill="#38bdf8"/>
    <circle cx="16" cy="134" r="2.5" fill="#22c55e"/>
  </g>

  <!-- 5. Glassmorphism Top Curved Specular Sheen -->
  <path d="M 8 124 C 8 60, 60 8, 124 8 L 388 8 C 452 8, 504 60, 504 124 C 420 160, 310 180, 256 180 C 190 180, 85 160, 8 124 Z"
        fill="#ffffff"
        fill-opacity="0.04"/>
</svg>